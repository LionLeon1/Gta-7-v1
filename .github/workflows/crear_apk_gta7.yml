name: Crear APK GTA 7

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 4. Crear base Android y reconstruir última versión (JSON o PY)
        run: |
          flutter create --platforms=android --org com.saycheese.agent --project-name saycheese_agent .
          python3 -c '
          import os, json, glob, re

          def orden_natural(texto):
              return [int(t) if t.isdigit() else t.lower() for t in re.split(r"(\d+)", texto)]

          json_files = sorted(glob.glob("*.json"), key=orden_natural)
          py_files = sorted(glob.glob("*.py"), key=orden_natural)

          if json_files:
              elegido = json_files[-1]
              print(f"Desempaquetando última versión JSON: {elegido}")
              data = json.load(open(elegido, encoding="utf-8"))
              for path, content in data.items():
                  if os.path.dirname(path):
                      os.makedirs(os.path.dirname(path), exist_ok=True)
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)
          elif py_files:
              elegido = py_files[-1]
              print(f"Ejecutando última versión PY: {elegido}")
              exec(open(elegido, encoding="utf-8").read())
          else:
              raise FileNotFoundError("No se encontró ningún archivo .json ni .py en el repositorio.")
          '

      - name: 5. Compilar APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: 6. Subir Instalador APK
        uses: actions/upload-artifact@v4
        with:
          name: GTA7-Real-Life-APK
          path: build/app/outputs/flutter-apk/app-release.apk
